<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>위클리 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: a GoodNotes-style planner page on a desk. Left: framed week (date row → per-day task list → full-day time grid).
   Right: month title, Weekly goals + mini calendar side by side, Habit Tracker, then folded extras. */
:root{
  --desk:#e8e6e1; --page:#fdfcfa; --ink:#1f1e1b; --ink-2:#56544d; --muted:#9a978f; --line:#eeebe5; --line-2:#dcd8cf; --frame:#c8c4ba;
  --accent:#2f56c4; --accent-ink:#ffffff; --soft:rgb(47 86 196 / .08); --today:rgb(47 86 196 / .045);
  --ok:#3da56f; --crit:#c8412d; --warn:#b07a12; --now:#d9452f;
  --mix:46%; --fgbase:#26241f; --fgmix:30%;
  --shadow-page:0 1px 2px rgb(40 36 28 / .06),0 10px 30px rgb(40 36 28 / .08);
  --shadow:0 14px 44px rgb(30 28 24 / .16),0 1px 3px rgb(30 28 24 / .08);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0d0d0c; --page:#171716; --ink:#ecebe6; --ink-2:#b5b2aa; --muted:#7c7972; --line:#232321; --line-2:#302f2c; --frame:#3d3c38;
  --accent:#93acff; --accent-ink:#11141d; --soft:rgb(147 172 255 / .12); --today:rgb(147 172 255 / .05);
  --ok:#5fcf93; --crit:#ff8a74; --warn:#e6b65a; --now:#ff7a62;
  --mix:40%; --fgbase:#f6f5f1; --fgmix:22%;
  --shadow-page:0 1px 2px rgb(0 0 0 / .4),0 10px 30px rgb(0 0 0 / .35); --shadow:0 16px 48px rgb(0 0 0 / .55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#0d0d0c; --page:#171716; --ink:#ecebe6; --ink-2:#b5b2aa; --muted:#7c7972; --line:#232321; --line-2:#302f2c; --frame:#3d3c38;
  --accent:#93acff; --accent-ink:#11141d; --soft:rgb(147 172 255 / .12); --today:rgb(147 172 255 / .05);
  --ok:#5fcf93; --crit:#ff8a74; --warn:#e6b65a; --now:#ff7a62;
  --mix:40%; --fgbase:#f6f5f1; --fgmix:22%;
  --shadow-page:0 1px 2px rgb(0 0 0 / .4),0 10px 30px rgb(0 0 0 / .35); --shadow:0 16px 48px rgb(0 0 0 / .55); color-scheme:dark;
}
/* GoodNotes-like palette: one hue per color, mixed per theme */
.c-slate{--hue:#6c70a0} .c-blue{--hue:#5ba6e3} .c-green{--hue:#5cbc86} .c-teal{--hue:#3fb3ae} .c-violet{--hue:#9a7fdf}
.c-rose{--hue:#ec8193} .c-amber{--hue:#efc04c} .c-orange{--hue:#ef975c} .c-lime{--hue:#9ccc5a} .c-red{--hue:#e8675f}
.c-salmon{--hue:#e8756b} .c-peach{--hue:#efa15c} .c-butter{--hue:#efcb45} .c-leaf{--hue:#66c266} .c-aqua{--hue:#54b9d0} .c-lilac{--hue:#b58be0} .c-pink{--hue:#ec7fb0}
.c-brick{--hue:#b0574f} .c-tan{--hue:#b8825a} .c-khaki{--hue:#a98b3f} .c-moss{--hue:#4f9a5a} .c-steel{--hue:#3f8a9a} .c-denim{--hue:#5f78b8} .c-mauve{--hue:#8f70b0}
.c-orchid{--hue:#c06fb0} .c-coral{--hue:#d95f3f} .c-indigo{--hue:#4a4ac0} .c-plum{--hue:#a8608a}
[class*="c-"]{--cb:color-mix(in oklab,var(--hue) var(--mix),var(--page));--cf:color-mix(in oklab,var(--hue) var(--fgmix),var(--fgbase))}

html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#app{height:100%;padding:14px 16px;box-sizing:border-box}
.page{height:100%;display:flex;flex-direction:column;background:var(--page);border-radius:12px;box-shadow:var(--shadow-page);padding:10px 22px 18px;box-sizing:border-box;min-width:0}

/* ---------- toolbar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:4px 10px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:2px}
.ib{border:0;background:transparent;border-radius:7px;min-width:30px;height:30px;display:inline-grid;place-items:center;color:var(--ink-2);font-size:17px;line-height:1}
.ib:hover{background:var(--soft);color:var(--ink)}
.btn{border:1px solid var(--line-2);background:var(--page);border-radius:999px;padding:0 13px;height:30px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:500}
.btn:hover{border-color:var(--frame);background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{border-color:transparent;background:transparent;color:var(--crit)}
.btn.danger:hover{background:color-mix(in oklab,var(--crit) 10%,transparent)}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.sp{flex:1}
.wk{font-size:14px;font-weight:600;min-width:128px;text-align:center}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:190px;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--page);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow)}
.pop .brush,.pop .mi{width:100%;height:34px;justify-content:flex-start;flex:none}
#palette{display:grid;grid-template-columns:repeat(3,minmax(118px,1fr));width:max-content}
#palette[hidden]{display:none}
#palette .mi{grid-column:1/-1}
@media (max-width:520px){#palette{position:fixed;left:16px;right:16px;top:auto;width:auto;grid-template-columns:repeat(2,minmax(0,1fr))}}
.mi{display:flex;align-items:center;border:0;background:none;border-radius:8px;padding:0 10px;font-size:13px;color:var(--ink);text-align:left}
.mi:hover{background:var(--soft)}
.mi-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px 4px;margin-top:4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.brushdot{width:10px;height:10px;border-radius:3px;background:color-mix(in oklab,var(--hue) 80%,var(--page));display:inline-block;margin:0 6px 0 7px}
.guide{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:13px;color:var(--ink-2)}
.guide b{color:var(--accent)}
.guide button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12.5px}
.now{display:flex;flex-direction:column;gap:6px;padding:15px 15px 14px;border:1px solid var(--frame);border-radius:14px;flex:none}
.now[hidden]{display:none}
.now-eye{font-size:12px;color:var(--muted)}
.now-eye b{color:var(--accent);font-weight:600;margin-right:6px}
.now-t{margin:0;font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.now .btn{width:100%;height:40px;margin-top:6px;font-size:14px;font-weight:600}
.now-next{font-size:12.5px;color:var(--ink-2)}
.now-p{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
.now-p b{color:var(--ink);font-weight:500}
.now-bar{height:5px;border-radius:9px;background:var(--line-2);overflow:hidden}
.now-bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.hhead{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 6px}
.hhead h3{margin:0;font-size:12.5px;text-align:left}
.brush{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:0 9px;height:28px;font-size:12px;color:var(--ink-2)}
.brush i{width:10px;height:10px;border-radius:3px;background:color-mix(in oklab,var(--hue) 80%,var(--page))}
.brush:hover{background:var(--soft)}
.brush.on{background:var(--cb);color:var(--cf);font-weight:600}
.tools{display:flex;gap:6px;align-items:center}
.seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;height:30px}
.seg2 button{border:0;background:transparent;padding:0 10px;font-size:12px;color:var(--muted)}
.seg2 button.on{background:var(--soft);color:var(--ink);font-weight:600}
.banner{font-size:12px;color:var(--warn);padding:6px 0 0}

/* ---------- page layout ---------- */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,1fr);gap:12px;padding-top:12px}
.board{min-height:0;min-width:0;display:flex;flex-direction:column}
#scroller{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border:1px solid var(--frame);border-radius:10px;background:var(--page)}
.inner{min-width:700px;width:var(--iw,auto);position:relative}
.sticky{position:sticky;top:0;z-index:6;background:var(--page)}
.row{display:grid;grid-template-columns:repeat(7,var(--dw,minmax(0,1fr)))}
.dh{padding:7px 8px 5px;display:flex;align-items:baseline;gap:5px;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.dh .dd{font-size:13px;font-weight:700}
.dh .dn{font-size:11.5px;color:var(--muted)}
.dh.wkend .dn{color:var(--crit)}
.dh.today .dd{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 5px}
.dh.today .dn{color:var(--accent);font-weight:600}
.corner{border-bottom:1px solid var(--line-2)}
.dh .st{margin-left:auto;border:0;background:var(--soft);color:var(--ink-2);font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px}
.dh .st.ok{background:color-mix(in oklab,var(--ok) 18%,var(--page));color:var(--ok)}
.drawing .col{cursor:crosshair}
.bl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.bl li{display:flex;align-items:flex-start;gap:9px;padding:4px 0;font-size:13px;line-height:1.4}
.bl li input{margin-top:2px;width:15px;height:15px}
.bl li label{flex:1;min-width:0;cursor:pointer}
.bl li.urgent label{color:var(--crit);font-weight:600}
.bl li.done label{color:var(--muted);text-decoration:line-through;font-weight:400}
.btag{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.allday{border-bottom:1.5px solid var(--frame)}
.ad{border-left:1px solid var(--line-2);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;height:var(--adh,128px);overflow-y:auto;box-sizing:border-box}
.ad.today,.col.today{background-color:var(--today)}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:5px;background:var(--cb);color:var(--cf);font-size:11.5px;font-weight:600;padding:2px 6px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk{display:flex;align-items:center;gap:6px;min-height:21px}
.tick{width:15px;height:15px;flex:none;border-radius:50%;border:1.5px solid var(--hue,var(--muted));background:transparent;padding:0;display:grid;place-items:center}
.tick:hover{background:color-mix(in oklab,var(--hue,var(--muted)) 18%,transparent)}
.tk.done .tick{background:var(--ok);border-color:var(--ok)}
.tk.done .tick::after{content:"";width:4px;height:7px;border:solid var(--page);border-width:0 1.8px 1.8px 0;transform:translateY(-1px) rotate(45deg)}
.tn{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn:hover{color:var(--accent)}
.tk.done .tn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.tk.pending{opacity:.55}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.04em;flex:none}
.t-test .tag{color:var(--crit)} .t-quiz .tag{color:var(--warn)}
.hn{position:absolute;left:0;z-index:2;width:calc(100% / 6);display:grid;place-items:center;font-size:9.5px;color:color-mix(in oklab,var(--ink) 34%,transparent);pointer-events:none}
.col{position:relative;touch-action:pan-y;--gl:color-mix(in oklab,var(--ink) 6%,transparent);--gl2:color-mix(in oklab,var(--ink) 15%,transparent)}
/* paper grid drawn over the blocks: one row = 1 hour, one square = 10 minutes */
.col::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px),linear-gradient(to bottom,var(--gl2) 1px,transparent 1px),linear-gradient(to right,var(--gl) 1px,transparent 1px);
  background-size:100% 100%,100% var(--hh),var(--cw,calc(100% / 6)) var(--hh)}
.blk{position:absolute;inset:0;color:var(--cf);pointer-events:none;user-select:none;-webkit-user-select:none}
.sg{position:absolute;box-sizing:border-box;background:var(--cb);pointer-events:auto;cursor:grab;touch-action:pan-y}
.blk:hover .sg{filter:brightness(1.05)}
.blk-in{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box;text-align:center;pointer-events:none;overflow:hidden}
.blk .bt{font-size:14px;font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bi{margin-right:4px;font-weight:400}
.blk.short .bt{font-size:12px}
.blk.tiny .bt{font-size:10.5px}
.blk.ov .sg{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--crit) 80%,transparent)}   /* 3+ blocks share this hour: outlined so the overlap is obvious */
.blk.sel .sg{box-shadow:inset 0 0 0 2px var(--accent)}
.selecting .col{cursor:crosshair} .selecting .sg{cursor:pointer}
#marq{position:fixed;z-index:70;border:1.5px solid var(--accent);background:var(--soft);pointer-events:none}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--page);padding:7px 8px 7px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;white-space:nowrap}
.selbar[hidden]{display:none}
.selbar button{border:0;border-radius:999px;height:30px;padding:0 14px;font-weight:600;background:transparent;color:inherit;opacity:.8}
.selbar button.del{background:var(--crit);color:#fff;opacity:1}
.hz{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.hz-t{left:0} .hz-b{right:0}
.blk:hover .hz-b::after{content:"";position:absolute;right:1px;top:50%;width:2px;height:12px;margin-top:-6px;border-radius:2px;background:var(--cf);opacity:.5}
.blk.drag{opacity:.3}
.dragghost{position:absolute;inset:0;z-index:4;color:var(--cf);pointer-events:none}
.dragghost .sg{pointer-events:none}
.dragghost .blk-in{font-size:11px;font-weight:600;white-space:nowrap}
.nowline{position:absolute;width:0;border-left:2px solid var(--now);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--now)}

/* ---------- right column ---------- */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.box{border:1px solid var(--frame);border-radius:10px;padding:9px 10px 10px;min-width:0;display:flex;flex-direction:column}
.box h3{margin:0 0 6px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.bh{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.bh h3{margin:0;flex:1}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;padding:1px 4px;border-radius:5px}
.linkbtn:hover{color:var(--ink);background:var(--soft)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.mini .h{font-size:9.5px;color:var(--muted);padding-bottom:2px}
.mini button{border:0;background:transparent;border-radius:4px;font-size:10.5px;padding:3px 0 4px;position:relative;color:var(--ink-2)}
.mini button:hover{background:var(--soft)}
.mini button.out{opacity:.35}
.mini button.inweek{background:var(--soft);color:var(--ink);border-radius:0}
.mini button.inweek.wk0{border-radius:4px 0 0 4px} .mini button.inweek.wk6{border-radius:0 4px 4px 0}
.mini button.today{color:var(--accent);font-weight:700}
.mini button.has::after{content:"";position:absolute;left:50%;bottom:0;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--muted)}
.mini button.crit::after{background:var(--crit)}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.goals li{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.35;padding:2px 0}
.goals li input{margin-top:1px}
.goals li.done span{text-decoration:line-through;color:var(--muted)}
.goals span{flex:1;min-width:0;overflow-wrap:anywhere}
.goals .del{border:0;background:none;color:var(--muted);font-size:13px;padding:0 2px;opacity:0;line-height:1}
.goals li:hover .del,.goals .del:focus-visible{opacity:1}
.addrow{display:flex;margin-top:4px}
.addrow input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line-2);background:transparent;padding:3px 1px;font-size:12px}
.addrow input:focus{outline:none;border-bottom:1px solid var(--accent)}
.nextwk{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line-2)}
.nextwk label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:2px}
.nextwk textarea{width:100%;box-sizing:border-box;border:0;background:transparent;resize:none;font-size:12px;line-height:1.4;padding:0;min-height:44px}
.nextwk textarea:focus{outline:none}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--ok);margin:0}
.habits h3{margin:4px 0 8px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.hdays{display:grid;grid-template-columns:repeat(7,30px) 1fr;gap:4px;padding-left:2px;margin-bottom:2px}
.hdays span{font-size:9.5px;color:var(--muted);text-align:center}
.hdays span.today{color:var(--accent);font-weight:700}
.habit{padding:6px 0 7px;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.hname{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;margin-bottom:5px}
.hname .hi{width:22px;height:22px;border:1px solid var(--line-2);border-radius:5px;display:grid;place-items:center;font-size:13px;flex:none}
.hcells{display:grid;grid-template-columns:repeat(7,30px) 1fr;gap:4px;align-items:center;padding-left:2px}
.stamp{width:30px;height:26px;border:1px solid var(--line-2);border-radius:5px;background:transparent;padding:0;font-size:14px;line-height:1;display:grid;place-items:center}
.stamp:hover{border-color:var(--frame);background:var(--soft)}
.stamp.today{border-color:var(--accent)}
.stamp.on{background:color-mix(in oklab,var(--ok) 14%,var(--page));border-color:color-mix(in oklab,var(--ok) 45%,var(--page))}
.stamp.x{color:var(--crit);font-size:13px;font-weight:700;background:color-mix(in oklab,var(--crit) 9%,var(--page))}
.hcells .cnt{font-size:11px;color:var(--muted);text-align:right}
.folds{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:2px}
.card{padding:11px 0;border-bottom:1px solid var(--line)}
.card h3{margin:0;font-size:12px;font-weight:600;color:var(--ink-2)}
.ch{display:flex;align-items:center;gap:8px;min-height:20px}
.card:not(.closed) .ch{margin-bottom:10px}
.ch .meta{font-size:11.5px;color:var(--muted)}
.foldbtn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:inherit;flex:1;min-width:0;text-align:left}
.foldbtn .meta{margin-left:auto;padding-right:2px}
.chev{width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 2px}
.foldbtn[aria-expanded="true"] .chev{transform:rotate(45deg)}
.foldbtn:hover h3{color:var(--ink)}
.md{font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-size:12.5px;margin:1em 0 .3em;font-weight:600}
.md h1{font-size:16px;margin-top:0}
.md p{margin:.3em 0} .md ul{margin:.25em 0;padding-left:1.1em} .md li{margin:.2em 0} .md li::marker{color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:.9em 0}
.md code{font-size:12px;background:var(--soft);padding:0 4px;border-radius:4px}
.md b{font-weight:600}
.md .tw{overflow-x:auto;margin:.4em 0}
.md table{border-collapse:collapse;font-size:12.5px;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:5px 8px 5px 0;text-align:left;vertical-align:top}
.md th{color:var(--muted);font-weight:500;font-size:11.5px}
.brief-body{max-height:220px;overflow:hidden;position:relative}
.brief-body h1{display:none}
.brief-body>:first-child{margin-top:0}
.brief-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(to bottom,transparent,var(--page))}
.empty{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl button{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:7px;padding:5px 6px 5px 0}
.tl button:hover{background:var(--soft)}
.dday{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right}
.dday.over{color:var(--crit)} .dday.soon{color:var(--warn)}
.tl .tn2{font-size:13px;line-height:1.35;display:block} .tl .tc{display:block;font-size:11.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--crit);display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin:0}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12px;color:var(--ink-2)}
.bar .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar .fl{height:100%;background:color-mix(in oklab,var(--hue) 80%,var(--page));border-radius:3px}
.bar .v{font-size:11.5px;color:var(--muted);text-align:right}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgb(12 12 10 / .36);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{position:relative;background:var(--page);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(700px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.mh h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.mh .dot{width:12px;height:12px;border-radius:3px;background:var(--cb);box-shadow:inset 0 0 0 1px var(--hue);flex:none}
.mh select{border:1px solid var(--line-2);background:transparent;border-radius:7px;padding:4px 6px;font-size:12.5px}
.mb{padding:12px 20px 16px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;align-items:center;padding:12px 20px 18px;flex-wrap:wrap}
.ar-break{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer}
.ar-break input{margin-top:3px;accent-color:var(--accent)}
.ar-break span{color:var(--ink);font-size:13px}
.ar-break small{display:block;color:var(--muted);font-size:12px}
.ar-sec{margin-top:14px}
.ar-sec h3{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.ar-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.ar-row span:first-child{min-width:0;overflow-wrap:anywhere}
.ar-row span:last-child{flex:none;color:var(--muted)}
.ar-empty{margin:14px 0 0;color:var(--muted);font-size:13px}
.mb label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.mb label.chk{flex-direction:row;align-items:center;gap:9px;color:var(--ink);font-size:13.5px}
.mb input:not([type=checkbox]):not([type=radio]),.mb select,.mb textarea{border:1px solid var(--line-2);background:var(--page);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);min-width:0}
.mb input:focus,.mb select:focus,.mb textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.mb label>input:not([type=checkbox]):not([type=radio]),.mb label>select,.mb label>textarea{width:100%;box-sizing:border-box;min-height:38px}
.mb label>textarea{resize:vertical}
.r3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.r2>*,.r3>*{min-width:0}
.typepick{display:flex;flex-wrap:wrap;gap:4px}
.typepick .brush{border:1px solid var(--line-2);height:30px}
.typepick .brush.on{border-color:transparent}
.lbl{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px} .kv dd{margin:0;overflow-wrap:anywhere}
.pill{display:inline-block;background:var(--cb,var(--soft));color:var(--cf,var(--ink));border-radius:5px;padding:1px 8px;font-size:12px;font-weight:600}
.statusseg{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.statusseg button{flex:1;border:0;background:transparent;padding:9px 6px;font-size:13px;color:var(--ink-2)}
.statusseg button+button{border-left:1px solid var(--line-2)}
.statusseg button.on{background:var(--ink);color:var(--page);font-weight:600}
.statusseg button.on.done{background:var(--ok);color:var(--page)}
.scope{display:flex;gap:16px} .scope label{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:13.5px}
.set-sec{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.set-sec h4{margin:8px 0 2px;font-size:13px;font-weight:600}
.set-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.set-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
.set-cell{display:flex;gap:4px;align-items:center;min-width:0}
.set-cell input{padding:6px 6px!important;font-size:13px!important;min-width:0}
.set-cell .ico{width:34px;flex:none;text-align:center}
.set-cell .grow{flex:1;width:0}
.set-cell .gh{width:14px;flex:none;text-align:center;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:14px}
.set-cell.dragging{opacity:.4}
.set-cell.drop{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.set-cell .sw.lg{width:24px;height:24px;border-radius:7px}
.set-cell .x{padding:2px 3px;flex:none}
@media (max-width:520px){.set-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.set-row input,.set-row select{padding:6px 8px!important;font-size:13px!important}
.set-row .grow{flex:1;min-width:110px}
.set-row .ico{width:44px;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:18px;height:18px;border-radius:5px;border:0;background:var(--cb);box-shadow:inset 0 0 0 1px var(--hue);padding:0}
.sw.lg{width:30px;height:30px;border-radius:8px;flex:none}
.cpop{position:fixed;z-index:60;display:grid;grid-template-columns:repeat(7,26px);gap:6px;padding:10px;background:var(--page);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow)}
.cpop .sw{width:26px;height:26px;border-radius:7px}
.sw.on{box-shadow:inset 0 0 0 1px var(--hue),0 0 0 2px var(--page),0 0 0 3.5px var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}
.x{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--soft)}
.tin{letter-spacing:.02em}
.tin.bad{border-color:var(--crit)!important;box-shadow:0 0 0 3px color-mix(in oklab,var(--crit) 15%,transparent)!important}
.set-row .tin{width:88px}
.help{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:13.5px;margin:0}
.help dt{color:var(--muted);font-size:12.5px} .help dd{margin:0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--page);border-radius:999px;padding:9px 18px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast button{border:0;background:none;color:inherit;font-weight:600;opacity:.75;padding:0}
#toast button:hover{opacity:1}

/* ---------- timer view: a dark study desk. One warm accent; subjects keep their colours as slim bars. ---------- */
:root{--tm:#f0924a;--tm-ink:#1c1208;--s1:color-mix(in oklab,var(--ink) 6%,var(--page));--s2:color-mix(in oklab,var(--ink) 12%,var(--page))}
.viewseg button{padding:0 12px;font-weight:500;font-size:12.5px}
.viewseg .tmb{margin-left:6px;color:var(--tm);font-weight:600;font-variant-numeric:tabular-nums}
.viewseg .tmb.rest{color:var(--muted)}
.mode-timer .pl-only{display:none!important}
#timerView{flex:1;min-height:0;overflow-y:auto;padding-top:14px}
.tm-wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px 44px;max-width:1040px;margin:0 auto;align-items:start}
.tm-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.tm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.tm-eye{margin:0;font-size:13px;color:var(--muted)}
.tm-ib{width:40px;height:40px;border:0;background:none;border-radius:12px;color:var(--muted);display:grid;place-items:center;padding:0;font-size:17px}
.tm-ib:hover{background:var(--s1);color:var(--ink)}
.tm-ib:disabled{opacity:.3;cursor:default}
.tm-ib svg{width:20px;height:20px}
.tm-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 8px;text-align:center}
.tm-big{font-size:clamp(62px,20vw,88px);font-weight:300;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tm-hero.studying .tm-big{color:var(--tm)}
.tm-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 18px;font-size:13px;color:var(--muted)}
.tm-meta b{color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.tm-now{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-height:22px;color:var(--ink)}
.tm-now.idle{color:var(--muted);font-weight:400}
.tm-now i{width:8px;height:8px;border-radius:50%;flex:none}
.tm-now.live i{animation:tmPulse 1.6s ease-in-out infinite}
@keyframes tmPulse{50%{opacity:.3}}
.tm-acts{display:flex;gap:10px;justify-content:center;width:100%}
.tm-b{height:50px;min-width:120px;padding:0 24px;border:0;border-radius:25px;background:var(--s2);color:var(--ink);font-size:15px;font-weight:600}
.tm-b.go{background:var(--tm);color:var(--tm-ink)}
.tm-b:disabled{opacity:.45;cursor:default}
.tm-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tm-h h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.tm-h>span{display:flex}
.tm-subjects{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tm-subj{width:100%;display:grid;grid-template-columns:5px minmax(0,1fr) auto 28px;align-items:center;gap:13px;min-height:62px;padding:0 14px 0 16px;border:0;border-radius:16px;background:var(--s1);text-align:left}
.tm-subj:hover{background:var(--s2)}
.tm-subj>i{height:24px;border-radius:3px;background:var(--c)}
.tm-subj b{font-size:15.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-subj span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tm-subj em{display:grid;place-items:center;font-style:normal;color:var(--muted)}
.tm-subj em svg{width:15px;height:15px}
.tm-subj.on{background:color-mix(in oklab,var(--c) 20%,var(--page))}
.tm-subj.on span,.tm-subj.on em{color:var(--ink)}
.tm-plan{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:16px;background:var(--soft);color:var(--ink);text-align:left}
.tm-plan span{min-width:0;flex:1;font-size:14px;font-weight:500}
.tm-plan small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.tm-plan em{font-style:normal;font-size:13px;font-weight:600;color:var(--accent);flex:none}
.tm-man{height:50px;border:1px dashed var(--line-2);border-radius:16px;background:none;color:var(--ink-2);font-size:14px;font-weight:500}
.tm-man:hover{color:var(--ink);border-color:var(--frame)}
.tm-pomo{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;margin-top:4px}
.tm-chip{height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:16px;background:none;color:var(--ink-2);font-size:13px;font-weight:500}
.tm-chip:hover{color:var(--ink);border-color:var(--frame)}
.tm-chip.on{background:var(--tm);border-color:var(--tm);color:var(--tm-ink);font-weight:600}
.tm-pcd{display:inline-flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.tm-chip{cursor:pointer}
#tmMirror{position:fixed;inset:0;z-index:60;background:var(--page);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:16px}
#tmMirror>.tm-chip{position:absolute;top:max(12px,env(safe-area-inset-top));right:16px}
#tmMirror .mn{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600}
#tmMirror .mn i{width:12px;height:12px;border-radius:50%}
#tmMirror .tm-dial{width:min(80vw,50vh)}
#tmMirror .tm-dial .c b{font-size:min(17vw,10vh)}
#tmMirror .tm-dial .c small{font-size:16px}
#tmMirror .mb{font-size:min(16vw,10vh);font-weight:300;font-variant-numeric:tabular-nums}
.tm-dialw{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 2px}
.tm-dial{--p:1;--dc:var(--tm);position:relative;width:min(220px,62vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--s1) 0 56%,transparent 57%),conic-gradient(var(--dc) calc(var(--p)*360deg),var(--s2) 0);box-shadow:0 0 0 6px var(--s1)}
.tm-dial::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -.6deg,var(--page) 0 1.2deg,transparent 1.2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 78%,#000 79%);mask:radial-gradient(circle,transparent 0 78%,#000 79%);pointer-events:none}
.tm-dial.brk{--dc:#3fb3ae}
.tm-dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tm-dial .c b{font-size:38px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.tm-dial .c small{font-size:12.5px;color:var(--muted)}
.tm-pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tm-pager strong{font-weight:600;font-size:15px}
.tm-mrow{display:flex;align-items:center;gap:14px}
.tm-mrow .seg2{flex:none}
.tm-mrow .tm-pager{flex:1;min-width:0}
.tm-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tm-kpi{display:flex;flex-direction:column;gap:1px;min-width:0}
.tm-kpi span{font-size:12px;color:var(--muted)}
.tm-kpi b{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tm-card{background:var(--s1);border-radius:16px;padding:14px 12px 10px}
.tm-plot{position:relative;height:170px;margin-left:28px}
.tm-gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2)}
.tm-gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:10.5px;color:var(--muted)}
.tm-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tm-cb{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;border-radius:8px}
.tm-cb:hover{background:var(--s2)}
.tm-cb .tot{font-size:10px;color:var(--muted);white-space:nowrap}
.tm-stack{width:58%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.tm-stack i{display:block;width:100%}
.tm-xl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-left:28px;margin-top:6px;text-align:center;font-size:11px;color:var(--muted);line-height:1.3}
.tm-xl .today{color:var(--tm);font-weight:600}
.tm-calh,.tm-calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tm-calh{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:8px}
.tm-cell{border:0;border-top:1px solid var(--line);background:none;min-height:74px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;color:var(--ink);font-size:13px}
.tm-cell.out{border-top-color:transparent}
.tm-cell:disabled{color:var(--muted);cursor:default}
.tm-cell:not(:disabled):hover{background:var(--s1)}
.tm-cell .d{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.tm-cell.today .d{background:var(--ink);color:var(--page);font-weight:600}
.tm-pill{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;max-width:62px;height:20px;border-radius:6px;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--tm);background:color-mix(in oklab,var(--tm) 13%,var(--page));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--tm) 38%,var(--page))}
.tm-pill svg{width:10px;height:10px;flex:none}
.tm-pill.goal{background:var(--tm);color:var(--tm-ink);box-shadow:none}
.tm-lg{display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:11px;color:var(--muted);padding-top:8px}
.tm-lg span{display:inline-flex;align-items:center;gap:5px}
.tm-lg i{width:11px;height:11px;border-radius:3px;background:var(--tm)}
.tm-lg i.soft{background:color-mix(in oklab,var(--tm) 13%,var(--page));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--tm) 38%,var(--page))}
.tm-bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tm-bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13.5px}
.tm-bars .nm{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tm-bars .nm i{width:8px;height:8px;border-radius:50%;flex:none}
.tm-bars .v{color:var(--muted);font-variant-numeric:tabular-nums}
.tm-bars .tr{grid-column:1/-1;height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.tm-bars .tr i{display:block;height:100%;border-radius:3px}
.tm-strip{display:grid;grid-template-columns:1.25fr repeat(7,minmax(0,1fr));align-items:end}

<script>
/* =====================================================================
   위클리 플래너
   Modules: Util · Store (db | localStorage) · Sources (Notion tasks,
   events, briefings) · Model (week/config) · Views (board, sidebar,
   modals) · Interaction (drag to create/move/resize).
   Data model (db):
     config/main      {blockTypes[], habits[], recurring[], snap}
     weeks/<monday>   {blocks[], goals[], skip[], habits{hid:{date:true}}}
     events/<id>      {title, category, date, endDate?, start?, end?, location?, notes?}
     briefings/<date> {date, createdAt, sources?, markdown}
     study/<date>     {date, totalMin, subjects[{name,min}], sessions[{start,end,subject}], source}
     timer/settings   {schema, dayStartHour, subjects[{id,name,color,archived?}]}
     timer/running    {running: {kind:'study'|'rest', subjectId, start, resumeId?} | null}
     timerDays/<date> {date, sessions[{id, subjectId, kind, start, end}]}   (epoch ms)
   ===================================================================== */
'use strict';

/* ---------- Util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dowOf = d => (d.getDay() + 6) % 7;                       // Mon = 0
const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -dowOf(d));
const ampm = m => (m % 1440 < 720 ? '오전' : '오후');
const hm0 = m => `${Math.floor(m / 60) % 12 || 12}:${pad(m % 60)}`;
const hm = m => `${ampm(m)} ${hm0(m)}`;                        // 12-hour display; minutes are always stored as numbers
const hmr = (a, b) => `${hm(a)}–${ampm(a) === ampm(b) ? hm0(b) : hm(b)}`;
const todayStr = () => ymd(new Date());
const dayDiff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const clone = o => JSON.parse(JSON.stringify(o));
const DOW = ['월', '화', '수', '목', '금', '토', '일'];
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }

/* ---------- App constants (defaults, not user data) ---------- */
let HH = 40;                                                   // height of one hour row in px (fit to screen in fitHours)
const COLORS = ['red', 'coral', 'salmon', 'brick', 'peach', 'orange', 'tan',   /* 7 per row = the colour popup's rows: warm → green → blue → purple/pink */
  'amber', 'butter', 'khaki', 'lime', 'leaf', 'green', 'moss',
  'teal', 'aqua', 'steel', 'blue', 'denim', 'indigo', 'slate',
  'violet', 'lilac', 'mauve', 'plum', 'orchid', 'pink', 'rose'];
const DEFAULT_TYPES = [
  { id: 'sleep', name: '잠', color: 'slate' }, { id: 'study', name: '공부', color: 'green' },
  { id: 'free', name: '휴식', color: 'orange' }, { id: 'workout', name: '운동', color: 'lime' }];
const TYPE_ICONS = { sleep: '💤', study: '✏️', free: '☕', workout: '🏃' };
const iconOf = t => (t.icon != null ? t.icon : TYPE_ICONS[t.id] || '');
const EVENT_CATS = { service: { name: '봉사', color: 'amber' }, show: { name: '공연', color: 'rose' }, exam: { name: '시험', color: 'red' },
  school: { name: '학교 행사', color: 'blue' }, personal: { name: '개인', color: 'violet' } };
const CLASS_COLORS = {};   // e.g. { 'Math': 'green' } — task class → colour
const NOTION = 'Notion';
const TASK_DS = 'collection://YOUR-NOTION-DATA-SOURCE-ID';   // your own Notion tasks database
const TASK_STATUSES = ['시작 전', '진행 중', '완료'];
const TASK_QUERY = { data: { mode: 'rows', data_source_url: TASK_DS, limit: 100,
  sort: [{ property: 'Deadline', direction: 'ascending' }],
  filter: { type: 'group', operator: 'or', filters: [
    { type: 'property', property: '상태', propertyType: 'status', operator: 'status_is_not', value: { type: 'is_option', value: '완료' } },
    { type: 'property', property: 'Deadline', propertyType: 'date', operator: 'date_is_on_or_after', value: { type: 'relative', value: 'one_week_ago' } }] } } };

/* ---------- State ---------- */
const S = {
  weekStart: mondayOf(new Date()), miniMonth: null,
  config: null, week: null, events: [], briefings: [],
  tasks: [], tasksState: 'loading', tasksErr: null, tasksAt: 0,
  selType: 'study', sel: new Set(), selMode: false, study: {}, mcp: null, undo: null, unsubWeek: null,
};
const cfg = () => S.config || { blockTypes: DEFAULT_TYPES, habits: [], recurring: [], snap: 15 };
const types = () => (cfg().blockTypes && cfg().blockTypes.length ? cfg().blockTypes : DEFAULT_TYPES);
const keepBrush = () => { if (!types().some(t => t.id === S.selType)) S.selType = types()[0].id; };
const typeOf = id => types().find(t => t.id === id) || { id, name: '블록', color: 'slate' };
const snapMin = () => 10;                                      // one grid square
const RS = () => (cfg().dayStart ?? 6) * 60, RE = () => (cfg().dayEnd ?? 27) * 60;   // visible range in minutes; past 24 = the early hours of the next day, stored on the same date (end > 1440)
const weekDates = () => Array.from({ length: 7 }, (_, i) => ymd(addDays(S.weekStart, i)));
const weekPath = (start = S.weekStart) => 'weeks/' + ymd(start);
/* db snapshots are frozen, so always work on a deep copy */
const normWeek = d => { d = d ? clone(d) : {}; return { blocks: d.blocks || [], goals: d.goals || [], skip: d.skip || [], habits: d.habits || {}, nextNote: d.nextNote || '' }; };

/* ---------- Store: artifact db, or this browser's storage as a fallback ---------- */
const Store = {
  db: null, local: [],
  async init() { try { if (window.claude && window.claude.use) this.db = await window.claude.use('db'); } catch (e) { this.db = null; } },
  get live() { return !!this.db; },
  lsGet(p) { try { return JSON.parse(localStorage.getItem('planner:' + p) || 'null'); } catch (e) { return null; } },
  lsSet(p, v) { try { localStorage.setItem('planner:' + p, JSON.stringify(v)); } catch (e) {} },
  lsDel(p) { try { localStorage.removeItem('planner:' + p); } catch (e) {} },
  lsList(coll) { const out = [], pre = 'planner:' + coll + '/';
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre) && !k.slice(pre.length).includes('/')) out.push({ id: k.slice(pre.length), ...JSON.parse(localStorage.getItem(k)) }); } } catch (e) {}
    return out; },
  lsNotify(path) { this.local.filter(l => path.startsWith(l.coll + '/')).forEach(l => l.fire()); },
  watchDoc(path, cb, onErr) {
    if (this.db) return this.db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), e => onErr && onErr(e));
    cb(this.lsGet(path)); return () => {};
  },
  watchColl(coll, q, cb, onErr) {
    if (this.db) { let r = this.db.collection(coll); if (q.orderBy) r = r.orderBy(q.orderBy, q.dir || 'asc'); if (q.limit) r = r.limit(q.limit);
      return r.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => onErr && onErr(e)); }
    const fire = () => { let rows = this.lsList(coll); if (q.orderBy) rows.sort((a, b) => String(a[q.orderBy]).localeCompare(String(b[q.orderBy])) * (q.dir === 'desc' ? -1 : 1)); cb(q.limit ? rows.slice(0, q.limit) : rows); };
    const l = { coll, fire }; this.local.push(l); fire(); return () => { this.local = this.local.filter(x => x !== l); };
  },
  async getDoc(path) { if (this.db) { const s = await this.db.doc(path).get(); return s.exists ? s.data() : null; } return this.lsGet(path); },
  async setDoc(path, data) { if (this.db) return this.db.doc(path).set(data); this.lsSet(path, data); this.lsNotify(path); },
  async updateDoc(path, data) { if (this.db) return this.db.doc(path).update(data); this.lsSet(path, { ...(this.lsGet(path) || {}), ...data }); this.lsNotify(path); },
  async delDoc(path) { if (this.db) return this.db.doc(path).delete(); this.lsDel(path); this.lsNotify(path); },
};

/* Debounced, one-at-a-time writer per document. Snapshots are ignored while a write is pending. */
const W = {};
function saveDoc(path, getData, delay = 350) {
  const w = W[path] || (W[path] = { t: null, chain: Promise.resolve(), pending: 0, armed: false });
  clearTimeout(w.t); if (!w.armed) { w.pending++; w.armed = true; }
  w.t = setTimeout(() => {
    w.armed = false; const data = getData();
    w.chain = w.chain.then(() => Store.setDoc(path, data)).catch(e => toast(dbErrText(e))).finally(() => { w.pending--; });
  }, delay);
}
const busy = path => !!(W[path] && W[path].pending > 0);
function dbErrText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return '저장 공간이 꽉 찼어. 오래된 주 데이터를 정리해야 해.';
  if (c === 'invalid_argument') return '저장할 수 없는 데이터라 저장이 거절됐어.';
  if (c === 'revoked' || c === 'not_granted') return '이 화면에서는 저장 권한이 없어.';
  return '저장 중 문제가 생겼어. 잠시 뒤 다시 해 줘.';
}
const saveWeek = () => { const wk = S.week, p = weekPath(); saveDoc(p, () => clone(wk)); };
const saveConfig = () => { const c = S.config; saveDoc('config/main', () => clone(c), 50); };
function snapshotUndo(label) { S.undo = { path: weekPath(), data: clone(S.week), cfg: clone(cfg()), label }; }
function doUndo() {
  if (!S.undo || S.undo.path !== weekPath()) return;
  S.week = normWeek(S.undo.data); S.config = S.undo.cfg; S.undo = null;
  saveWeek(); saveConfig(); renderBoard(); renderSide(); toast('되돌렸어');
}

/* ---------- Model: items shown on a date ---------- */
function itemsFor(date) {
  const dw = dowOf(parse(date)), out = [];
  for (const r of cfg().recurring || []) {
    if (r.dow !== dw || (r.from && date < r.from) || (r.until && date > r.until) || S.week.skip.includes(r.id + '@' + date)) continue;
    out.push({ id: 'r|' + r.id + '|' + date, rec: r.id, typeId: r.typeId, title: r.title || '', note: r.note || '', start: r.start, end: r.end, date });
  }
  for (const b of S.week.blocks) if (b.date === date) out.push({ ...b });

function planNow() {

  const now = nowMin(), list = itemsFor(today).filter(it => it.typeId !== 'sleep' && it.end > now).sort((a, b) => a.start - b.start);
  const on = list.filter(it => it.start <= now);

  const g = PLAN_ALIASES.find(a => a.some(w => t.includes(w)));

/* ---------- Markdown (briefings) ---------- */
function inline(s) { return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function md(src) {
  const L = esc(src).split('\n'); let out = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^\s*\|/.test(l)) { const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) { rows.push(L[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += `<div class="tw"><table><thead><tr>${cells(body[0]).map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; continue; }
    if (/^\s*[-*] /.test(l)) { let items = ''; while (i < L.length && /^\s*[-*] /.test(L[i])) { items += `<li>${inline(L[i].replace(/^\s*[-*] /, ''))}</li>`; i++; } out += `<ul>${items}</ul>`; continue; }
    let m;
    if ((m = l.match(/^(#{1,4}) (.*)/))) { const lv = Math.min(m[1].length, 3); out += `<h${lv}>${inline(m[2].replace(/^[\p{Extended_Pictographic}️‍\s]+/u, ''))}</h${lv}>`; }
    else if (/^-{3,}\s*$/.test(l)) out += '<hr>';
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
    i++;
  }
  return out;
}

/* Typed time fields: accepts 8:15, 08:15, 815, 0815, 8, 24:00 */
const GOAL_STUDY = 120;   /* daily study goal (minutes) */
const fmtDur = m => `${Math.floor(m / 60)}:${pad(Math.round(m % 60))}`;
const fmtT = hm;
function parseTime(s) {
  s = String(s || '').trim(); let h, m;
  const ap = s.match(/^(오전|오후|am|pm)\s*/i); if (ap) s = s.slice(ap[0].length);
  const c = s.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})$/);
  if (c) { h = +c[1]; m = +c[2]; }
  else if (/^\d{1,4}$/.test(s)) { if (s.length <= 2) { h = +s; m = 0; } else { h = +s.slice(0, s.length - 2); m = +s.slice(-2); } }
  else return null;
  if (ap) { if (h < 1 || h > 12) return null; h = h % 12 + (/오후|pm/i.test(ap[1]) ? 12 : 0); }
  if (m > 59 || h > 24 || (h === 24 && m > 0)) return null;
  return h * 60 + m;
}

function wire() {
  $('#prevW').onclick = () => setWeek(addDays(S.weekStart, -7));
  $('#nextW').onclick = () => setWeek(addDays(S.weekStart, 7));
  $('#todayBtn').onclick = () => setWeek(new Date());
  $('#addEvent').onclick = () => openEventEditor(null);
  $('#autoArrange').onclick = () => openArrange();
  $('#selBtn').onclick = () => { if (S.selMode) endSel(); else { S.selMode = true; renderSel(); } };
  $('#selbar').onclick = e => { const b = e.target.closest('[data-sel]'); if (!b) return; const a = b.dataset.sel;
    if (a === 'del') deleteSelected(); else if (a === 'clear') { S.sel.clear(); $$('#gridRow .blk.sel').forEach(x => x.classList.remove('sel')); renderSel(); } else endSel(); };
  $('#zoomSeg').onclick = e => { const b = e.target.closest('[data-z]'); if (!b) return; UI.zoom = b.dataset.z; saveUI(); S.sc0 = false; renderHeader(); renderBoard(); };
  addEventListener('keydown', e => { if (!S.selMode || !$('#modalRoot').hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')) return;
    if (e.key === 'Escape') endSel(); else if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel.size) { e.preventDefault(); deleteSelected(); } });
  $('#brushBtn').onclick = () => togglePop('#palette');
  $('#moreBtn').onclick = () => togglePop('#morePop');
  $$('#morePop .mi').forEach(b => b.addEventListener('click', closePops));
  $('#banner').addEventListener('click', e => { if (e.target.id === 'guideOff') { UI.guided = true; saveUI(); renderHeader(); } });
  addEventListener('pointerdown', e => { if (!e.target.closest('.menu')) closePops(); });
  setInterval(renderNow, 60000);
  $('#openSettings').onclick = openSettings;
  $('#helpBtn').onclick = openHelp;
  $('#viewSeg').onclick = e => { const b = e.target.closest('[data-v]'); if (b && b.dataset.v !== UI.view) setView(b.dataset.v); };
  $('#timerView').addEventListener('click', e => { const el = e.target.closest('[data-ta]'); if (!el || el.disabled) return; const fn = TM_ACT[el.dataset.ta]; if (fn) fn(el, e); });
  document.addEventListener('visibilitychange', tmWake);
  /* live numbers every second; the stats redraw every 30 s while a timer runs */
  setInterval(() => { tmTick(); if (TM.running && UI.view === 'timer' && new Date().getSeconds() % 30 === 0 && !TM.busy) renderTimer(); }, 1000);
  $('#palette').onclick = e => { if (e.target.closest('[data-newtype]')) { closePops(); openNewType(); return; } const b = e.target.closest('[data-type]'); if (!b) return; S.selType = b.dataset.type; closePops(); renderHeader(); };
  $('#gridRow').addEventListener('pointerdown', onDown);
  $('#adRow').onclick = e => { const k = e.target.closest('[data-tick]'), ev = e.target.closest('[data-ev]'), t = e.target.closest('[data-task]');
    if (k) { const task = S.tasks.find(x => x.id === k.dataset.tick); if (!task) return; if (!S.mcp) { toast('Notion 과제는 claude.ai에서 열었을 때만 바꿀 수 있어'); return; }
      if (task.status === '완료') setTaskStatus(task, task.prevStatus || '시작 전'); else { task.prevStatus = task.status; setTaskStatus(task, '완료'); } }
    else if (ev) openEvent(ev.dataset.ev); else if (t) openTask(t.dataset.task); };
  $('#headRow').onclick = e => { const b = e.target.closest('[data-study]'); if (b) openStudy(b.dataset.study); };
  $('#side').addEventListener('input', e => { if (e.target.id === 'nextNote') { S.week.nextNote = e.target.value; saveWeek(); } });
  $('#side').addEventListener('click', e => {
    const q = s => e.target.closest(s);
    let el;
    if ((el = q('[data-now]'))) { setView('timer'); if (el.dataset.now === 'start') TM_ACT.toggle({ dataset: { id: el.dataset.id } }); }
    else if ((el = q('[data-fold]'))) { const k = el.dataset.fold; UI.open[k] = el.getAttribute('aria-expanded') !== 'true'; saveUI(); renderSide(); }
    else if ((el = q('[data-go]'))) setWeek(parse(el.dataset.go));
    else if ((el = q('[data-mm]'))) { const b = S.miniMonth || new Date(S.weekStart.getFullYear(), S.weekStart.getMonth(), 1); S.miniMonth = new Date(b.getFullYear(), b.getMonth() + +el.dataset.mm, 1); renderMini(); }
    else if ((el = q('[data-brief]'))) openBriefing(el.dataset.brief);
    else if ((el = q('[data-task]'))) openTask(el.dataset.task);
    else if (q('[data-reload]')) loadTasks();
    else if (q('[data-settings]')) openSettings();
    else if ((el = q('[data-goaldel]'))) { S.week.goals = S.week.goals.filter(g => g.id !== el.dataset.goaldel); saveWeek(); renderGoals(); }
    else if ((el = q('[data-hab]'))) { const h = el.dataset.hab, d = el.dataset.date; const mp = S.week.habits[h] || (S.week.habits[h] = {}); const v = mp[d]; if (!v) mp[d] = true; else if (v === true) mp[d] = 'x'; else delete mp[d]; saveWeek(); renderHabits(); }
  });
  $('#side').addEventListener('change', e => {
    const bi = e.target.closest('[data-bitem]');
    if (bi) { const b = S.briefings[0]; if (!b || !Array.isArray(b.items)) return; const items = clone(b.items); items[+bi.dataset.bitem].done = bi.checked;
      S.briefings[0] = { ...b, items }; renderBrief(); Store.updateDoc('briefings/' + b.id, { items }).catch(err => toast(dbErrText(err))); return; } const g = e.target.closest('[data-goal]'); if (!g) return; const x = S.week.goals.find(x => x.id === g.dataset.goal); if (x) { x.done = g.checked; saveWeek(); renderGoals(); } });
  $('#side').addEventListener('submit', e => { if (e.target.id !== 'goalForm') return; e.preventDefault(); const v = $('#goalIn').value.trim(); if (!v) return; S.week.goals.push({ id: uid('g'), text: v, done: false }); saveWeek(); renderGoals(); $('#goalIn').focus(); });
  $('#modalRoot').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  /* Never fail silently: surface unexpected script errors */
  addEventListener('error', e => toast('문제가 생겼어: ' + String(e.message || '').slice(0, 80)));
  /* Tidy typed times on leaving the field ("815" → "08:15"); mark ones that can't be read. */
  $('#modalRoot').addEventListener('focusout', e => { const el = e.target; if (!el.classList || !el.classList.contains('tin')) return;
    const t = parseTime(el.value); el.classList.toggle('bad', t == null); if (t != null) el.value = fmtT(t); });
  $('#modalRoot').addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('tin')) e.target.select(); });
  addEventListener('keydown', e => {   /* ⌘Z / Ctrl+Z undoes the last board change (the settings window has its own undo) */
    if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.key.toLowerCase() !== 'z' || !$('#modalRoot').hidden || UI.view === 'timer' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')) return;
    if (S.undo) { e.preventDefault(); doUndo(); } });
  addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#modalRoot').hidden) closeModal(); else closePops(); });
  setInterval(() => { const n = $('.nowline'); if (n) n.style.cssText = nowStyle(nowMin()); }, 60000);
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.week) renderBoard(); }, 150); });
  setInterval(() => { if (document.visibilityState === 'visible' && S.mcp && S.tasksState !== 'loading') loadTasks(); }, 10 * 60000);
}

async function boot() {
  if (!UI.view) UI.view = innerWidth < 760 ? 'timer' : 'planner';
  wire(); applyView();
  setWeek(new Date());
  await Store.init();
  try { if (window.claude && window.claude.use) S.mcp = await window.claude.use('mcp'); } catch (e) { S.mcp = null; }
  tmStart();
  renderHeader();
  Store.watchDoc('config/main', d => { if (busy('config/main')) return; S.config = d ? clone(d) : null; keepBrush(); renderHeader(); renderBoardAllday(); renderSide(); }, e => toast(dbErrText(e)));
  setWeek(S.weekStart);
  Store.watchColl('events', {}, rows => { S.events = rows; renderBoardAllday(); renderMini(); });
  Store.watchColl('study', { orderBy: 'date', dir: 'desc', limit: 400 }, rows => { S.study = Object.fromEntries(rows.map(r => [r.date || r.id, r])); renderBoardAllday(); renderTotals(); tmQueue(); });
  Store.watchColl('briefings', { orderBy: 'date', dir: 'desc', limit: 14 }, rows => { S.briefings = rows; renderBrief(); });
  loadTasks();
}
boot();
</script>

</body></html>
